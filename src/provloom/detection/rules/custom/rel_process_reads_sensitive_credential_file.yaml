rule_type: provloom_custom
rule_id: custom-rel-proc-reads-sensitive-file
rule_name: Process Reads Sensitive Credential or Key File
version: "1.0.0"
description: Detects a process with a DETERMINISTIC READS relation targeting SSH private keys, credential stores, or SAM/shadow files.
severity: critical
attack_tags:
  - attack.credential_access
  - attack.t1552.004
logsource:
  category: provenance_graph
  product: provloom
detection_type: RELATION
relation_spec:
  src_entity_type: PROCESS
  relation_type: READS
  dst_entity_type: FILE
  deterministic_only: true
  min_evidence_count: 1
  dst_predicates:
    - field: display_label
      op: regex
      value: '(id_rsa|id_ed25519|etc/shadow|system32\\config\\sam|\.kdbx|credentials)'
