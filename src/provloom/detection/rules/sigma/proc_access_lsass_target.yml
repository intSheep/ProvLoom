title: LSASS Process Access by Non-System Binary
id: 6d4b1e8c-91b2-4e45-8c01-100700000099
status: stable
version: 1.0.0
description: Detects process access targeting lsass.exe from non-core system executables.
references:
  - https://github.com/SigmaHQ/sigma/tree/master/rules/windows/process_access
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  category: process_access
  product: windows
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'
  filter_system:
    SourceImage|endswith:
      - '\wininit.exe'
      - '\csrss.exe'
      - '\services.exe'
  condition: selection and not filter_system
level: critical
