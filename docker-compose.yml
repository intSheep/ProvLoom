services:
  postgres:
    image: postgres:16-alpine
    container_name: provloom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-provloom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-provloom}
      POSTGRES_DB: ${POSTGRES_DB:-provloom}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - provloom_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-provloom} -d $${POSTGRES_DB:-provloom}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  provloom_pgdata:
