name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: provloom
          POSTGRES_PASSWORD: provloom
          POSTGRES_DB: provloom
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U provloom -d provloom"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Lint & format check
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Typecheck
        run: |
          uv run mypy src
          uv run mypy --strict tests
      - name: Run database migrations (PostgreSQL 16)
        env:
          PROVLOOM_DATABASE_URL: postgresql+psycopg://provloom:provloom@127.0.0.1:5432/provloom
        run: uv run alembic upgrade head
      - name: Full test & acceptance suite (SQLite + PostgreSQL 16)
        env:
          PROVLOOM_EVAL_PG_URL: postgresql+psycopg://provloom:provloom@127.0.0.1:5432/provloom
        run: uv run pytest -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
