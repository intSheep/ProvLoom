[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "provloom"
version = "0.2.0"
description = "Deterministic OCSF v1.3 security fact, provenance graph, and detection signal service for APT investigation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
keywords = [
    "ocsf",
    "provenance-graph",
    "sigma",
    "apt",
    "threat-hunting",
    "cybersecurity",
    "dfir",
    "ai-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.13.0",
    "pyyaml>=6.0.1",
    "orjson>=3.10.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    "python-multipart>=0.0.9",
    "pysigma>=1.0.0",
    "pysigma-pipeline-ocsf>=0.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
provloom = "provloom.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/provloom"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "B905", "UP007", "UP042", "UP045", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["provloom"]

[[tool.mypy.overrides]]
module = ["sigma.pipelines.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: fast pure domain and contract tests",
    "integration: repository, CLI, and extended pipeline tests",
    "acceptance: PRD AC-01..AC-10 end-to-end verification suite",
]
