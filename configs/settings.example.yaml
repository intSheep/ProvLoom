environment: development

database:
  url: postgresql+psycopg://provloom:provloom@localhost:5432/provloom
  pool_size: 10
  echo_sql: false

ocsf:
  version: "1.4.0"
  mappings_dir: configs/mappings

correlation:
  network_max_clock_skew_seconds: 5.0
  require_five_tuple_for_deterministic: true

query_guards:
  default_page_limit: 100
  max_page_limit: 500
  max_graph_depth: 6
  max_graph_nodes: 250
  max_graph_edges: 600
