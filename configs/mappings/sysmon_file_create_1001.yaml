rule_id: sysmon_file_create_1001
rule_version: "1.0.0"
ocsf_version: "1.4.0"
match:
  parser_id: sysmon
  event_code: "11"
target:
  category_uid: 1
  class_uid: 1001
  activity_id: 1
fields:
  metadata.original_uid: EventRecordID
  device.hostname: Computer
  actor.user.name: User
  actor.process.uid: ProcessGuid
  actor.process.pid: ProcessId
  actor.process.file.path: Image
  file.path: TargetFilename
  file.hashes.value: sha256
