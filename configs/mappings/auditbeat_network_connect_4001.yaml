rule_id: auditbeat_network_connect_4001
rule_version: "1.0.0"
ocsf_version: "1.4.0"
match:
  parser_id: auditbeat
  event_code: network_connect
target:
  category_uid: 4
  class_uid: 4001
  activity_id: 1
fields:
  metadata.original_uid: event_uid
  device.uid: host_id
  device.hostname: host_name
  actor.user.name: user_name
  actor.user.uid: user_uid
  actor.process.pid: pid
  actor.process.file.path: executable
  actor.process.cmd_line: cmd_line
  src_endpoint.ip: src_ip
  src_endpoint.port: src_port
  dst_endpoint.ip: dst_ip
  dst_endpoint.port: dst_port
  connection_info.protocol_name: protocol
