rule_id: asset_inventory_5001
rule_version: "1.0.0"
ocsf_version: "1.4.0"
match:
  parser_id: asset
  event_code: inventory
target:
  category_uid: 5
  class_uid: 5001
  activity_id: 2
fields:
  metadata.original_uid: asset_id
  device.uid: asset_id
  device.hostname: hostname
  device.ip: ip
  device.os.name: os
  unmapped.is_nat_shared: is_nat_shared
  unmapped.valid_from: valid_from
  unmapped.valid_to: valid_to
  unmapped.container_id: container_id
  unmapped.runtime: runtime
  unmapped.service_name: service_name
  unmapped.listen_port: listen_port
