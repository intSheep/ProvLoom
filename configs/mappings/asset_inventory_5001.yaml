rule_id: asset_inventory_5001
rule_version: "1.0.0"
ocsf_version: "1.3.0"
match:
  parser_id: asset
  event_code: inventory
target:
  category_uid: 5
  class_uid: 5001
  activity_id: 2
fields:
  metadata.original_uid: asset_id
  device.uid: asset_id
  device.hostname: hostname
  device.ip: ip
  device.os.name: os
  device.is_nat_shared: is_nat_shared
  device.valid_from: valid_from
  device.valid_to: valid_to
  container.uid: container_id
  container.runtime: runtime
  service.name: service_name
  service.port: listen_port
